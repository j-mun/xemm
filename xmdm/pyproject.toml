[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xmdm"
version = "2026.1.0"
description = "JAX-compatible material data and optical dispersion models"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
  { name = "Jungho Mun", email = "mjh92@postech.ac.kr" }
]
keywords = ["materials", "optics", "jax"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent"
]
dependencies = [
  "numpy",
  "jax",
  "xser==2026.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.setuptools.data-files]
"xmdm-db" = ["*.json"]

[project.urls]
Homepage = "https://github.com/j-mun/xemm"
Repository = "https://github.com/j-mun/xemm"